<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 · 页面不存在</title>
<style>
:root{--paper:#faf8f5;--ink:#1b1a18;--ink-2:#514c45;--rule:#e6e1d9;--rule-2:#d1c9be;--accent:#9e3b21;
      --serif:Georgia,"Iowan Old Style","Songti SC","STSong","SimSun",serif;
      --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
      --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--paper);color:var(--ink);font-family:var(--sans);
     display:flex;align-items:center;justify-content:center;padding:24px}
.box{max-width:460px;width:100%;text-align:center}
.code{font-family:var(--serif);font-size:78px;font-weight:600;letter-spacing:-.04em;line-height:1;color:var(--ink)}
h1{font-size:20px;font-weight:600;margin:16px 0 0;letter-spacing:-.01em}
p{color:var(--ink-2);font-size:14.5px;line-height:1.8;margin:12px 0 0}
.list{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:24px}
.list a{font-family:var(--mono);font-size:12.5px;color:var(--ink-2);text-decoration:none;
        border:1px solid var(--rule-2);border-radius:3px;padding:4px 11px;transition:border-color .16s,color .16s}
.list a:hover{color:var(--accent);border-color:var(--accent);text-decoration:none}
.act{margin-top:30px}
.btn{display:inline-block;font-size:13.5px;font-weight:500;color:var(--paper);background:var(--ink);
     border-radius:3px;padding:8px 18px;text-decoration:none;transition:background .16s}
.btn:hover{background:#000;text-decoration:none}
</style>
</head>
<body>
<div class="box">
  <div class="code">404</div>
  <h1>页面不存在</h1>
  <p>请求的路径在站点根目录下没有对应的资源。<br>以下入口一定存在：</p>
  <div class="list">
    <a href="/">/</a>
    <a href="/about">/about</a>
    <a href="/api/status">/api/status</a>
  </div>
  <div class="act"><a class="btn" href="/">返回首页</a></div>
</div>
</body>
</html>
